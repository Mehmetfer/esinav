# === METRO e-SINAV - PHP Portal ===
server {
  server_name sinav.metromtsk.xyz;
  
  root /opt/metro/infra/nginx/sinav-metro/php-sinav;
  index index.php index.html;
  
  # PHP desteği
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_index index.php;
    fastcgi_read_timeout 120;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # Mevcut API proxy (Node.js dashboard için korunur)
  location /api/demo/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }
  
  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sinav.metromtsk.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sinav.metromtsk.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sinav.metromtsk.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name sinav.metromtsk.xyz;
    return 404; # managed by Certbot

}