# === METRO MTSK (Adana Sürücü Kursu) ===
# Not: metromtsk.xyz için sertifika yok, HTTP-only
server {
    server_name metromtsk.xyz www.metromtsk.xyz;

    root /opt/metro/infra/nginx/sinav-metro/metromtsk;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metromtsk.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metromtsk.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# === KAHIAN (Kripto Trading Platform) ===
server {
    listen 80;
    listen [::]:80;
    server_name kahian-155-103-70-66.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kahian-155-103-70-66.sslip.io;

    ssl_certificate /etc/letsencrypt/live/kahian-155-103-70-66.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kahian-155-103-70-66.sslip.io/privkey.pem;

    root /opt/metro/infra/nginx/sinav-metro/kahian;
    index index.html;

    location ~* \.html$ {
        try_files $uri @khain;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ @khain;
    }

    location @khain {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

